name: Publicar en Firebase Hosting

# Firebase queda en pausa automática.
#
# Motivo: Google Cloud/Firebase no está disponible para la cuenta de Google
# que administra el portal desde Venezuela. Al intentar crear el proyecto,
# Google crea el proyecto de Cloud pero rechaza activar Firebase con:
#   403 The caller does not have permission
# Eso no se arregla desde el repositorio.
#
# GitHub Pages sigue publicando el portal en cada push:
#   https://latabernadelmagallanesnews-jpg.github.io/taberna-magallanes-informa/
#
# Para reactivar Firebase:
#   1. Use una cuenta de Google con Google Cloud/Firebase habilitado, o la
#      cuenta dueña del proyecto la-taberna-del-magallanes-news.
#   2. Agregue el secreto FIREBASE_SERVICE_ACCOUNT en Settings > Secrets and
#      variables > Actions.
#   3. Ejecute este flujo manualmente desde la pestaña Actions.
#
# Nota: Firebase está bloqueado en China; para el espejo de China use
# Netlify o Vercel, que ya están configurados en el repositorio.

on:
  workflow_dispatch:

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    name: Construir y publicar
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'la-taberna-del-magallanes-news' }}

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund

      - name: Aplicar el editor con formato (Word)
        run: npm run parche

      - name: Conectar el lector de formato en las páginas sueltas
        run: npm run paginas

      - name: Regenerar data.json
        run: npm run data

      - name: Verificar sintaxis del portal
        run: npm run sintaxis

      - name: Verificar módulos y CMS
        run: npm run verificar

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Autenticar con Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT en Settings > Secrets and variables > Actions."
            echo "::error::Firebase no está disponible para esta cuenta de Google (Venezuela). Use GitHub Pages, Netlify o Vercel."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          # La clave privada viene con \n escapados en el JSON del secreto.
          node -e "const fs=require('fs');const p=process.env.RUNNER_TEMP+'/firebase-service-account.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(j.private_key)j.private_key=j.private_key.replace(/\\\\n/g,'\n');fs.writeFileSync(p,JSON.stringify(j));"

      - name: Publicar en Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive \
            --message "Publicación automática desde GitHub (${{ github.sha }})"

      - name: Resumen
        run: |
          echo "### Portal publicado."
          echo "Proyecto: $FIREBASE_PROJECT_ID"
          echo "Siguiente paso: en la consola de Firebase, Hosting > Añadir dominio personalizado si quiere usar su dominio."
